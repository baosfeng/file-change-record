name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 最小权限：CI 只读仓库内容，不需要写 GITHUB_TOKEN
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root toolchain (eslint, dependency-cruiser)
        run: npm install

      # 质量门禁：单元测试 + 覆盖率（行≥85 / 分支≥75，低于阈值即失败）
      # 每个插件 npm test 自带 node --test --experimental-test-coverage 阈值参数
      - name: Test all plugins under plugins/ (unit tests + coverage gates)
        run: |
          set -e
          for d in plugins/*/; do
            [ -f "$d/package.json" ] || continue
            echo "== $d =="
            for f in lib/index.js lib/client.js; do
              [ -f "$d$f" ] && node --check "$d$f"
            done
            (cd "$d" && npm test)
          done

      # 质量门禁：代码质量规则 + 尺寸规则（complexity≤10 / 函数≤40行 / 文件≤300行）。
      # P2 模块拆分（G9-G12）完成后启用尺寸规则强制（client 构建产物已在
      # eslint.config.js ignores 排除，src/parts 模板与片段照常检查）。
      - name: Lint (quality rules + size gates)
        run: npx eslint plugins/

      # 质量门禁：依赖结构分析（无循环依赖、server/client 不交叉）
      - name: Dependency analysis
        run: npx depcruise plugins/
