# dsh-my-guard bundle patch: inserts the plugin row into the profile roster.
# The row mounts the host half (pre-execute guard + poison scan + prompt
# injection detection + alert store) and the client half (sidebar guard
# panel). Install with:
#
#   git clone https://github.com/baosfeng/my-dsh-plugins.git
#   dsh plugin --profile web add link:<仓库路径>/plugins/dsh-my-guard
- insert:
    - id: guard
      name: 'dsh-my-guard'
