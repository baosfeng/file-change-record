# dsh-mermaid-render bundle patch: inserts the plugin row into the profile
# roster. The row mounts the (empty) host half; the client half renders
# mermaid/mmd code blocks in the conversation. Install with:
#
#   git clone https://github.com/baosfeng/my-dsh-plugins.git
#   dsh plugin --profile web add link:<仓库路径>/plugins/dsh-mermaid-render
#
# NOTE: after install, restart `dsh web` so the bundle layer composes.
- insert:
    - id: mermaid-render
      name: 'dsh-mermaid-render'
